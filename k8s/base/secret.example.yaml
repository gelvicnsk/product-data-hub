# MODÈLE uniquement : ce fichier n'est pas appliqué (absent de kustomization.yaml).
# Le vrai Secret est créé à partir de .env par scripts/k8s_up.sh :
#   kubectl -n product-hub create secret generic product-hub-secrets --from-literal=...
apiVersion: v1
kind: Secret
metadata:
  name: product-hub-secrets
  namespace: product-hub
type: Opaque
stringData:
  POSTGRES_USER: hub_admin
  POSTGRES_PASSWORD: "<à remplir>"
  API_DB_USER: api_reader
  API_DB_PASSWORD: "<à remplir>"
  API_WRITER_DB_USER: api_writer
  API_WRITER_DB_PASSWORD: "<à remplir>"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "<à remplir>"
  KC_DEMO_READER_PASSWORD: "<à remplir>"
  KC_DEMO_STEWARD_PASSWORD: "<à remplir>"
