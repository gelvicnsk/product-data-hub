# Exécution quotidienne (idempotente) : nouvelles journées déposées, CRM incrémental, dbt.
# En production, Airflow tient ce rôle (dags/product_hub_daily.py) ; ce CronJob montre
# l'alternative « native Kubernetes » quand un orchestrateur complet n'est pas nécessaire.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline-daily
spec:
  schedule: "15 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {app: pipeline}
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          containers:
            - name: pipeline
              image: product-hub/pipeline:dev
              imagePullPolicy: IfNotPresent
              args: ["daily"]
              envFrom:
                - configMapRef: {name: product-hub-config}
                - secretRef: {name: product-hub-secrets}
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits: {memory: 1536Mi}
              volumeMounts:
                - {name: data, mountPath: /data}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: product-hub-data
