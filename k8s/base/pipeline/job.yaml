# Initialisation : simule les sources (initContainer), puis ingère tout et construit dbt.
apiVersion: batch/v1
kind: Job
metadata:
  name: pipeline-init
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app: pipeline}
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        - name: simulate
          image: product-hub/pipeline:dev
          imagePullPolicy: IfNotPresent
          args: ["simulate"]
          envFrom:
            - configMapRef: {name: product-hub-config}
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: pipeline
          image: product-hub/pipeline:dev
          imagePullPolicy: IfNotPresent
          args: ["init"]
          envFrom:
            - configMapRef: {name: product-hub-config}
            - secretRef: {name: product-hub-secrets}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: product-hub-data
