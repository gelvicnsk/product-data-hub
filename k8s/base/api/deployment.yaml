apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        # migrations Alembic avant chaque démarrage (idempotent : rien à faire si à jour)
        - name: migrate
          image: product-hub/api:dev
          imagePullPolicy: IfNotPresent
          command: ["alembic", "-c", "api/alembic.ini", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: product-hub-config}
            - secretRef: {name: product-hub-secrets}
      containers:
        - name: api
          image: product-hub/api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: product-hub-config}
          env:
            # l'API ne reçoit que les identifiants de ses deux rôles, pas ceux du propriétaire
            - name: API_DB_USER
              valueFrom: {secretKeyRef: {name: product-hub-secrets, key: API_DB_USER}}
            - name: API_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: product-hub-secrets, key: API_DB_PASSWORD}}
            - name: API_WRITER_DB_USER
              valueFrom: {secretKeyRef: {name: product-hub-secrets, key: API_WRITER_DB_USER}}
            - name: API_WRITER_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: product-hub-secrets, key: API_WRITER_DB_PASSWORD}}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
