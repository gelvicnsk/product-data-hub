apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6.0
          args: ["start-dev", "--import-realm"]
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - {name: KC_HOSTNAME, value: "http://localhost:9180"}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            # seulement les secrets dont Keycloak a besoin (pas ceux de PostgreSQL)
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: product-hub-secrets, key: KC_BOOTSTRAP_ADMIN_PASSWORD}}
            - name: KC_DEMO_READER_PASSWORD
              valueFrom: {secretKeyRef: {name: product-hub-secrets, key: KC_DEMO_READER_PASSWORD}}
            - name: KC_DEMO_STEWARD_PASSWORD
              valueFrom: {secretKeyRef: {name: product-hub-secrets, key: KC_DEMO_STEWARD_PASSWORD}}
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
