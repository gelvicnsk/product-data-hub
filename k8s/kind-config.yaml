# Cluster local à un nœud (kind = Kubernetes dans Docker).
# Les ports NodePort de l'API et de Keycloak sont publiés sur la machine (WSL / Windows).
# Ports différents de docker-compose (8001, 8180) pour pouvoir garder les deux.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: product-hub
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30901   # API          -> http://localhost:9001
        hostPort: 9001
      - containerPort: 30918   # Keycloak     -> http://localhost:9180
        hostPort: 9180
