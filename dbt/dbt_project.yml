name: product_data_hub
version: "1.0.0"
config-version: 2
profile: product_data_hub

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  require_generic_test_arguments_property: true
  # requis par Elementary avec dbt >= 1.8 (voir la documentation du paquet)
  require_explicit_package_overrides_for_builtin_materializations: false
  source_freshness_run_project_hooks: true

vars:
  # Les journées sont simulées (octobre 2026). Elementary calcule ses fenêtres de détection
  # par rapport à l'heure du run : on lui donne « le lendemain matin de la dernière journée
  # simulée » au lieu de l'heure réelle. À surcharger en production (variable vide = maintenant).
  custom_run_started_at: "{{ env_var('PIPELINE_RUN_AT', '2026-10-31T06:00:00') }}"
  # Fenêtres des tests d'anomalies Elementary : 30 jours d'historique, dont les 14 derniers
  # sont examinés (seuil par défaut : 3 écarts types).
  training_period:
    period: day
    count: 30
  detection_period:
    period: day
    count: 14

models:
  product_data_hub:
    staging:
      +schema: staging
      # tables plutôt que vues : les vues sur raw (fenêtres row_number, casts) donnent à
      # PostgreSQL des estimations de lignes fausses et des plans en boucles imbriquées.
      # Matérialiser + ANALYZE ramène le build complet de ~15 s à quelques secondes.
      +materialized: table
      +post-hook: "analyze {{ this }}"
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      # statistiques à jour pour le planificateur PostgreSQL (tables recréées à chaque build)
      +post-hook: "analyze {{ this }}"

  elementary:
    # tables de métadonnées d'Elementary (résultats de tests, historique des runs)
    +schema: elementary

seeds:
  product_data_hub:
    +schema: staging

data_tests:
  product_data_hub:
    # les anomalies métier sont signalées sans bloquer le pipeline ;
    # les tests d'intégrité (clés, contrats) restent bloquants (severity: error par défaut)
    +store_failures: false
