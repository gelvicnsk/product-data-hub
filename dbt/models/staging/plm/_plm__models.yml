version: 2

models:
  - name: stg_plm__lifecycle
    description: État PLM de chaque produit physique, jour par jour.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [material_id, extract_date]
    columns:
      - name: lifecycle_state
        data_tests:
          - accepted_values:
              arguments:
                values: [PROTOTYPE, ACTIVE, END_OF_LIFE, RETIRED]
