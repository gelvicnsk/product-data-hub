version: 2

models:
  - name: stg_crm__accounts
    columns:
      - name: account_id
        data_tests: [unique, not_null]

  - name: stg_crm__quotes
    config:
      elementary:
        timestamp_column: created_at
    data_tests:
      # nombre de devis créés par jour : une chute brutale signale un problème en amont.
      # Les 14 jours examinés sont exclus de l'apprentissage : sinon la chute gonfle
      # elle-même l'écart type qui sert à la juger (z = -2,99, sous le seuil de 3 ;
      # avec l'exclusion, z = -3,71). Pas appliqué aux exports ERP : leur volume est
      # constant, l'écart type d'apprentissage y vaudrait 0 et aucun score ne serait calculable.
      - elementary.volume_anomalies:
          arguments:
            exclude_detection_period_from_training: true
          config:
            severity: warn
            meta:
              anomaly: quote_volume_drop
    columns:
      - name: quote_id
        data_tests: [unique, not_null]
      - name: quote_status
        data_tests:
          - accepted_values:
              arguments:
                values: [Draft, Presented, Accepted, Rejected]
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_crm__accounts')
                field: account_id

  - name: stg_crm__quote_lines
    columns:
      - name: quote_line_id
        data_tests: [unique, not_null]
      - name: quote_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_crm__quotes')
                field: quote_id
      - name: quantity
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
