[project]
name = "product-data-hub"
version = "0.1.0"
description = "Référentiel produit unifié construit à partir de sources d'entreprise simulées (ERP, CRM, PLM, catalogue)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests qui ont besoin d'un PostgreSQL (base de test dédiée)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["dbt/dbt_packages", "dbt/target"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# le dépôt contient d'autres dossiers (dbt, k8s, data...) : on liste les paquets Python
[tool.setuptools.packages.find]
include = ["sources*", "ingestion*", "api*", "analytics*"]
