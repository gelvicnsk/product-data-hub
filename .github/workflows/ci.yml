name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: product_hub_test
          POSTGRES_USER: hub_admin
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hub_admin -d product_hub_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      POSTGRES_USER: hub_admin
      POSTGRES_PASSWORD: ci_password
      POSTGRES_TEST_DB: product_hub_test
      # mots de passe jetables, uniquement pour la CI
      API_DB_PASSWORD: ci_api_password
      API_WRITER_DB_PASSWORD: ci_writer_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Initialiser la base de test
        env:
          PGPASSWORD: ci_password
        run: psql -h localhost -p 5433 -U hub_admin -d product_hub_test -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - name: Tests unitaires et d'intégration
        run: pytest -q -rs
      - name: Vérifier que les tests d'intégration n'ont pas été ignorés
        run: pytest -q -m integration -rs | tee pytest.log && ! grep -q "skipped" pytest.log

  pipeline:
    # bout en bout : simulation -> faux CRM -> ingestion -> dbt build -> contrôle des anomalies
    runs-on: ubuntu-latest
    needs: tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: product_hub
          POSTGRES_USER: hub_admin
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hub_admin -d product_hub"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      POSTGRES_DB: product_hub
      POSTGRES_USER: hub_admin
      POSTGRES_PASSWORD: ci_password
      # mots de passe jetables, uniquement pour la CI
      API_DB_PASSWORD: ci_api_password
      API_WRITER_DB_PASSWORD: ci_writer_password
      CRM_API_URL: http://localhost:8010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Initialiser l'entrepôt
        env:
          PGPASSWORD: ci_password
        run: psql -h localhost -p 5433 -U hub_admin -d product_hub -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - name: Simuler les sources
        run: python -m sources.simulate_days
      - name: Démarrer le faux CRM
        run: |
          nohup uvicorn sources.mock_crm.main:app --port 8010 > crm.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8010/health && break; sleep 1; done
      - name: Ingestion
        run: python -m ingestion.run --all
      - name: dbt build (dont snapshots et tests Elementary)
        working-directory: dbt
        run: |
          dbt deps --profiles-dir .
          dbt build --profiles-dir .
      - name: Migrations Alembic (schéma app) et vérification modèle = migrations
        run: |
          alembic -c api/alembic.ini upgrade head
          alembic -c api/alembic.ini check
      - name: Chaque anomalie et chaque incident sont-ils détectés ?
        run: python scripts/check_anomalies.py
      - name: Rapport Elementary
        run: edr report --profiles-dir dbt --project-dir dbt --file-path data/edr/report.html --open-browser false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-et-elementary
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
            data/edr/report.html

  airflow-dag:
    # Airflow dans son propre environnement, comme dans l'image : on vérifie que le DAG se charge
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: /tmp/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "apache-airflow==3.4.0" apache-airflow-providers-standard pytest
      - run: airflow db migrate
      - run: pytest -q --noconftest tests/unit/test_dag.py

  k8s-manifests:
    # les manifestes s'assemblent (kustomize) et respectent le schéma Kubernetes (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz" | tar xz
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
      - name: kustomize build + kubeconform
        run: |
          for overlay in dev prod; do
            ./kustomize build --load-restrictor LoadRestrictionsNone k8s/overlays/$overlay > $overlay.yaml
          done
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 dev.yaml prod.yaml
